name: 🎭 Comprehensive E2E Testing Suite

on:
  push:
    branches: [main, develop, e2e-testing]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run comprehensive tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - core
          - security
          - visual
          - performance
          - mobile
      browser:
        description: 'Browser to test'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit

env:
  NODE_VERSION: '18'
  PLAYWRIGHT_VERSION: '1.54.2'
  
jobs:
  test-setup:
    name: 🔧 Test Environment Setup
    runs-on: ubuntu-latest
    outputs:
      test-matrix: ${{ steps.setup-matrix.outputs.matrix }}
    steps:
      - name: Setup test matrix
        id: setup-matrix
        run: |
          if [ "${{ github.event.inputs.test_suite }}" = "core" ]; then
            matrix='["core-user-journey", "auth-flow", "qr-creation", "dashboard-workflows"]'
          elif [ "${{ github.event.inputs.test_suite }}" = "security" ]; then
            matrix='["security-comprehensive"]'
          elif [ "${{ github.event.inputs.test_suite }}" = "visual" ]; then
            matrix='["visual-regression-comprehensive", "visual-regression-enhanced"]'
          elif [ "${{ github.event.inputs.test_suite }}" = "performance" ]; then
            matrix='["performance-load", "network-failure-simulation"]'
          elif [ "${{ github.event.inputs.test_suite }}" = "mobile" ]; then
            matrix='["mobile-device"]'
          else
            matrix='["auth-flow", "qr-creation", "dashboard-workflows", "security-comprehensive", "visual-regression-comprehensive", "performance-load", "mobile-device", "network-failure-simulation"]'
          fi
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  lint-and-type-check:
    name: 🔍 Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🧹 ESLint check
        run: npx eslint src/ tests/ --ext .ts,.tsx --format github

      - name: 🔍 TypeScript check
        run: npx tsc --noEmit

      - name: 🏗️ Next.js architecture validation
        run: npm run validate:nextjs

  e2e-tests:
    name: 🎭 E2E Tests - ${{ matrix.test-file }} (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: [test-setup, lint-and-type-check]
    strategy:
      fail-fast: false
      matrix:
        test-file: ${{ fromJson(needs.test-setup.outputs.test-matrix) }}
        browser: ${{ github.event.inputs.browser == 'all' && fromJson('["chromium", "firefox", "webkit"]') || fromJson(format('["{0}"]', github.event.inputs.browser)) }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: 🗄️ Setup test database (PostgreSQL)
        uses: harmon758/postgresql-action@v1
        with:
          postgresql version: '16'
          postgresql db: 'qr_test'
          postgresql user: 'test_user'
          postgresql password: 'test_password'

      - name: 🔧 Setup environment variables
        run: |
          echo "DATABASE_URL=postgresql://test_user:test_password@localhost:5432/qr_test" >> $GITHUB_ENV
          echo "NEXTAUTH_URL=http://localhost:3004" >> $GITHUB_ENV
          echo "NEXTAUTH_SECRET=test-secret-key-for-ci" >> $GITHUB_ENV
          echo "NODE_ENV=test" >> $GITHUB_ENV

      - name: 🔄 Run database migrations
        run: npx prisma migrate deploy

      - name: 🧪 Generate Prisma client
        run: npx prisma generate

      - name: 🏃 Run E2E tests
        run: |
          npx playwright test tests/${{ matrix.test-file }}.spec.ts \
            --project=${{ matrix.browser }} \
            --reporter=html,json,junit \
            --output-dir=test-results/${{ matrix.test-file }}-${{ matrix.browser }}
        env:
          CI: true
          PLAYWRIGHT_HTML_REPORT: test-results/html-report-${{ matrix.test-file }}-${{ matrix.browser }}

      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.test-file }}-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30

      - name: 📋 Upload test report to GitHub Pages
        if: always() && matrix.browser == 'chromium'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: test-results/html-report-${{ matrix.test-file }}-${{ matrix.browser }}
          destination_dir: test-reports/${{ matrix.test-file }}

  visual-regression-baseline:
    name: 📸 Visual Regression Baseline Update
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright browsers
        run: npx playwright install --with-deps

      - name: 📸 Update visual baselines
        run: npx playwright test tests/visual-regression-comprehensive.spec.ts --update-snapshots

      - name: 💾 Commit updated baselines
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add tests/
          git diff --staged --quiet || git commit -m "Update visual regression baselines [skip ci]"
          git push

  performance-monitoring:
    name: ⚡ Performance Monitoring
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: ⚡ Run performance tests
        run: |
          npx playwright test tests/performance-load.spec.ts \
            --project=chromium \
            --reporter=json \
            --output-dir=performance-results
        env:
          CI: true

      - name: 📈 Process performance metrics
        run: |
          node -e "
          const fs = require('fs');
          const results = JSON.parse(fs.readFileSync('performance-results/results.json'));
          const perfTests = results.suites.find(s => s.title.includes('Performance'));
          if (perfTests) {
            console.log('## Performance Test Results');
            perfTests.specs.forEach(spec => {
              const duration = spec.tests[0]?.results[0]?.duration || 0;
              console.log(\`- \${spec.title}: \${duration}ms\`);
            });
          }
          " >> $GITHUB_STEP_SUMMARY

  security-scan:
    name: 🔒 Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔍 Run security audit
        run: npm audit --audit-level=moderate

      - name: 🎭 Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: 🔒 Run security tests
        run: |
          npx playwright test tests/security-comprehensive.spec.ts \
            --project=chromium \
            --reporter=json \
            --output-dir=security-results
        env:
          CI: true

      - name: 📋 Security scan summary
        if: always()
        run: |
          echo "## Security Test Results" >> $GITHUB_STEP_SUMMARY
          if [ -f security-results/results.json ]; then
            node -e "
            const results = JSON.parse(require('fs').readFileSync('security-results/results.json'));
            const passed = results.stats.passed || 0;
            const failed = results.stats.failed || 0;
            const total = passed + failed;
            console.log(\`- Total security tests: \${total}\`);
            console.log(\`- Passed: \${passed}\`);
            console.log(\`- Failed: \${failed}\`);
            if (failed > 0) {
              console.log('⚠️ Some security tests failed. Please review.');
            } else {
              console.log('✅ All security tests passed.');
            }
            " >> $GITHUB_STEP_SUMMARY
          fi

  test-report:
    name: 📊 Aggregate Test Report
    runs-on: ubuntu-latest
    needs: [e2e-tests, performance-monitoring, security-scan]
    if: always()
    steps:
      - name: 📥 Download all test artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-test-results

      - name: 📊 Generate comprehensive report
        run: |
          echo "# 🎭 Comprehensive E2E Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          
          # Count test result files
          total_suites=$(find ./all-test-results -name "results.json" | wc -l)
          echo "- Total test suites executed: $total_suites" >> $GITHUB_STEP_SUMMARY
          
          # Process each results file
          for result_file in $(find ./all-test-results -name "results.json"); do
            suite_name=$(basename $(dirname "$result_file"))
            echo "- $suite_name: Processing..." >> $GITHUB_STEP_SUMMARY
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Artifacts Generated" >> $GITHUB_STEP_SUMMARY
          echo "- HTML Test Reports: Available in artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Screenshots: Available for failed tests" >> $GITHUB_STEP_SUMMARY
          echo "- Performance Metrics: Available in performance artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan Results: Available in security artifacts" >> $GITHUB_STEP_SUMMARY

  deploy-test-reports:
    name: 🚀 Deploy Test Reports
    runs-on: ubuntu-latest
    needs: [test-report]
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download test artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./test-artifacts

      - name: 🏗️ Build report index
        run: |
          mkdir -p ./public/test-reports
          echo "<html><head><title>E2E Test Reports</title></head><body>" > ./public/test-reports/index.html
          echo "<h1>QR Generator E2E Test Reports</h1>" >> ./public/test-reports/index.html
          echo "<ul>" >> ./public/test-reports/index.html
          for dir in ./test-artifacts/*/; do
            dirname=$(basename "$dir")
            echo "<li><a href=\"$dirname/index.html\">$dirname</a></li>" >> ./public/test-reports/index.html
          done
          echo "</ul></body></html>" >> ./public/test-reports/index.html
          
          # Copy all test reports
          cp -r ./test-artifacts/* ./public/test-reports/

      - name: 🌐 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          destination_dir: reports

  notify-completion:
    name: 📢 Notification
    runs-on: ubuntu-latest
    needs: [e2e-tests, performance-monitoring, security-scan, test-report]
    if: always()
    steps:
      - name: 📢 Test completion notification
        run: |
          if [ "${{ needs.e2e-tests.result }}" = "success" ] && [ "${{ needs.security-scan.result }}" = "success" ]; then
            echo "✅ All comprehensive E2E tests passed successfully!"
          else
            echo "❌ Some tests failed. Please check the reports."
            exit 1
          fi